name: Frontend
on:
  push:
    paths:
      [
        "apps/web/**",
        "apps/api/**",
        "packages/api-client/**",
        "package*.json",
        ".github/workflows/web.yml",
      ]
  pull_request:
    paths:
      [
        "apps/web/**",
        "apps/api/**",
        "packages/api-client/**",
        "package*.json",
        ".github/workflows/web.yml",
      ]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATAFLOW_PYTHON: python
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dataflow
          POSTGRES_PASSWORD: dataflow_local
          POSTGRES_DB: dataflow_e2e
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U dataflow -d dataflow_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -c apps/api/requirements.lock -e "apps/api[dev]"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: apps/web/test-results/
          retention-days: 7
