name: Backend
on:
  push:
    paths:
      [
        "apps/api/**",
        "contracts/**",
        "packages/api-client/**",
        "tools/*.py",
        ".github/workflows/api.yml",
      ]
  pull_request:
    paths:
      [
        "apps/api/**",
        "contracts/**",
        "packages/api-client/**",
        "tools/*.py",
        ".github/workflows/api.yml",
      ]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dataflow
          POSTGRES_PASSWORD: dataflow_local
          POSTGRES_DB: dataflow
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U dataflow -d dataflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # Fase 12B: SQL Server real para tests/test_sqlserver_integration.py (licencia aceptada).
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: DataflowCI2026xyz
        ports: ["14333:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P DataflowCI2026xyz -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 10s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Microsoft ODBC Driver 18 for SQL Server
        run: |
          if odbcinst -q -d -n "ODBC Driver 18 for SQL Server" >/dev/null 2>&1; then exit 0; fi
          sudo apt-get update
          if ! sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc; then
            . /etc/os-release
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
              | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            echo "deb [signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/${VERSION_ID}/prod ${VERSION_CODENAME} main" \
              | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc
          fi
      - run: pip install -c requirements.lock -e ".[dev]"
        working-directory: apps/api
      - run: ruff check src tests migrations scripts ../../tools
        working-directory: apps/api
      - run: ruff format --check src tests migrations scripts ../../tools
        working-directory: apps/api
      - run: mypy
        working-directory: apps/api
      - run: alembic upgrade head
        working-directory: apps/api
      - run: alembic check
        working-directory: apps/api
      - run: pytest -q
        working-directory: apps/api
        env:
          DATAFLOW_TEST_SQLSERVER_HOST: 127.0.0.1
          DATAFLOW_TEST_SQLSERVER_PORT: "14333"
          DATAFLOW_TEST_SQLSERVER_USER: sa
          DATAFLOW_TEST_SQLSERVER_PASSWORD: DataflowCI2026xyz
      - run: python scripts/export_openapi.py --check
        working-directory: apps/api
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run api:generate
      - run: git diff --exit-code -- packages/api-client/src/schema.ts
