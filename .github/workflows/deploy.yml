name: Deploy
# Producción (ADR-052): compila las imágenes de la API y la web, las publica en GHCR con la
# etiqueta del commit y las despliega en el servidor por SSH. Cada fusión en `main` despliega;
# «Run workflow» con `version` vuelve a una etiqueta ya publicada sin compilar.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Etiqueta ya publicada (commit completo) a desplegar; vacío = este commit"
        required: false
        default: ""
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-production
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io
jobs:
  images:
    if: ${{ !inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      prefix: ${{ steps.names.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - id: names
        run: echo "prefix=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ steps.names.outputs.prefix }}-api:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.prefix }}-web:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: images
    # También cuando `images` se salta (vuelta a una versión anterior), nunca si falló.
    if: ${{ !failure() && !cancelled() && vars.DEPLOY_HOST != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      VERSION: ${{ inputs.version || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Clave SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Archivos de infraestructura
        run: >-
          rsync -rlt --delete -e "ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes"
          infrastructure/ "deploy@${HOST}:/opt/dataflow/infrastructure/"
      - name: Desplegar
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREFIX="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          # El token sólo vive durante este paso: el servidor no guarda credenciales de GHCR.
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/deploy "deploy@${HOST}" \
            "docker login ${REGISTRY} -u '${GITHUB_ACTOR}' --password-stdin >/dev/null \
             && sh /opt/dataflow/infrastructure/production/deploy.sh '${PREFIX}' '${VERSION}'; \
             status=\$?; docker logout ${REGISTRY} >/dev/null; exit \$status"
