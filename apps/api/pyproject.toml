[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dataflow-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic[email]>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<3", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "argon2-cffi>=23.1,<26",
  "polars>=1.30,<2",
  "reportlab>=5.1,<6",
  # Fuentes de la Fase 18B (ADR-035); sólo las importa el subproceso de ingesta.
  "pymssql>=2.3,<3", "pdfplumber>=0.11,<1",
  # Proveedor de IA del copiloto (Fase 10, ADR-022); sólo lo importa integrations/ai.
  "anthropic>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

# ReportLab no publica tipos (Fase 9): se acota su uso a modules/reports/pdf.py.
[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true
