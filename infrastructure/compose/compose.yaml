name: dataflow
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dataflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dataflow_local}
      POSTGRES_DB: dataflow
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataflow -d dataflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ../../apps/api
    profiles: ["full"]
    mem_limit: 768m
    environment:
      DATAFLOW_DATABASE_URL: postgresql+psycopg://dataflow:${POSTGRES_PASSWORD:-dataflow_local}@postgres:5432/dataflow
      # Copiloto IA (Fase 10, ADR-022): desactivado salvo que se pida. La clave nunca va en una
      # variable de este archivo: se monta como secreto de Docker.
      DATAFLOW_AI_PROVIDER: ${DATAFLOW_AI_PROVIDER:-disabled}
      DATAFLOW_AI_MODEL: ${DATAFLOW_AI_MODEL:-claude-opus-5-5}
      DATAFLOW_AI_API_KEY_FILE: /run/secrets/ai_api_key
      DATAFLOW_SOURCES_KEY_FILE: /run/secrets/sources_key
    secrets:
      - ai_api_key
      - sources_key
    volumes:
      - objects_data:/app/.data/objects
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build:
      context: ../../apps/api
    profiles: ["full"]
    command: ["python", "-m", "dataflow.bootstrap.worker"]
    init: true
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    environment:
      DATAFLOW_DATABASE_URL: postgresql+psycopg://dataflow:${POSTGRES_PASSWORD:-dataflow_local}@postgres:5432/dataflow
      POLARS_MAX_THREADS: 2
    volumes:
      - objects_data:/app/.data/objects
    depends_on:
      api:
        condition: service_healthy
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    profiles: ["full"]
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  objects_data:
secrets:
  # Sin clave, el archivo vacío versionado: el copiloto informa «sin clave» y todo lo demás
  # funciona. Para activarlo: DATAFLOW_AI_API_KEY_SECRET_FILE=ruta/a/la/clave (fuera del repo
  # o en ./secrets/, que git ignora) y DATAFLOW_AI_PROVIDER=anthropic.
  ai_api_key:
    file: ${DATAFLOW_AI_API_KEY_SECRET_FILE:-./secrets/ai_api_key.empty}
  # Fase 12B: clave Fernet que cifra las contraseñas de conexiones de SQL Server. Sin ella no
  # se pueden guardar conexiones (todo lo demás funciona). Generarla con:
  #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  sources_key:
    file: ${DATAFLOW_SOURCES_KEY_SECRET_FILE:-./secrets/ai_api_key.empty}
